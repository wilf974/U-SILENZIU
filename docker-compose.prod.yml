# Configuration Docker Compose pour PRODUCTION
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Version alignée avec DEV pour tests VPS

services:
  # Base de données PostgreSQL - Configuration PROD (alignée DEV)
  postgres:
    image: postgres:15-alpine
    container_name: u-silenziu-postgres
    environment:
      POSTGRES_DB: usilenzio
      POSTGRES_USER: usilenzio_user
      POSTGRES_PASSWORD: usilenzio_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      # Scripts d'init pour une base neuve (alignés sur DEV)
      - ./init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql
      - ./create-header-config-table.sql:/docker-entrypoint-initdb.d/10-create-header-config.sql
      - ./create-footer-config-table.sql:/docker-entrypoint-initdb.d/11-create-footer-config.sql
      - ./create-homepage-sections-table.sql:/docker-entrypoint-initdb.d/12-create-homepage-sections.sql
      - ./create-global-sections-table.sql:/docker-entrypoint-initdb.d/13-create-global-sections.sql
      - ./create-homepage-config-table.sql:/docker-entrypoint-initdb.d/14-create-homepage-config.sql
      - ./create-admin-users-table.sql:/docker-entrypoint-initdb.d/20-create-admin-users.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usilenzio_user -d usilenzio"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - u-silenziu-prod-network

  # Application Next.js - Configuration PROD (alignée DEV)
  u-silenziu:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: u-silenziu-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Configuration URL publique (IMPORTANT pour HTTPS)
      - NEXT_PUBLIC_APP_URL=https://rageroom.usilenziu.com
      - NEXT_PUBLIC_API_URL=https://rageroom.usilenziu.com/api
      # Secrets prod (changez ces valeurs pour le VPS !)
      - SESSION_SECRET=prod_session_secret_change_me_secure_2025
      - JWT_SECRET=prod_jwt_secret_change_me_secure_2025
      - ADMIN_JWT_SECRET=super_secret_admin_jwt_key_2024_usilenzio_very_long_and_secure
      - JWT_EXPIRES_IN=1h
      # Configuration PostgreSQL PROD (même base que dev pour compatibilité)
      - DATABASE_URL=postgresql://usilenzio_user:usilenzio_password_2024@postgres:5432/usilenzio
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=usilenzio
      - POSTGRES_USER=usilenzio_user
      - POSTGRES_PASSWORD=usilenzio_password_2024
      # Configuration SMTP
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=noreply@rageroom.usilenziu.com
      # Configuration uploads
      - UPLOAD_DIR=/app/public/uploads
      - UPLOAD_MAX_SIZE=10485760
      - UPLOAD_ALLOWED_TYPES=image/jpeg,image/png,image/gif,image/webp
      # Configuration Payplug (PRODUCTION - MODE TEST POUR TESTS)
      - PAYPLUG_SECRET_KEY=sk_test_4qzp5fowqEGBG93PjzZOlF
      - PAYPLUG_PUBLIC_KEY=pk_test_4qzp5fowqEGBG93PjzZOlF
      - PAYPLUG_WEBHOOK_SECRET=whsec_test_4qzp5fowqEGBG93PjzZOlF
      - PAYPLUG_MODE=test
      - NEXT_PUBLIC_SITE_URL=https://rageroom.usilenziu.com
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Volume pour les uploads et logs
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    networks:
      - u-silenziu-prod-network

  # Nginx - Reverse Proxy pour HTTPS
  nginx:
    image: nginx:alpine
    container_name: u-silenziu-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /opt/ssl/rageroom.usilenziu.com:/etc/letsencrypt/live/rageroom.usilenziu.com:ro
    depends_on:
      - u-silenziu
    restart: unless-stopped
    networks:
      - u-silenziu-prod-network

networks:
  u-silenziu-prod-network:
    driver: bridge
    name: u-silenziu-prod-network

volumes:
  postgres_prod_data:
    driver: local
    name: u-silenziu-postgres-prod-data