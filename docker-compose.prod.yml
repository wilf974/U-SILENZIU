version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: usilenziu-postgres
    environment:
      POSTGRES_DB: usilenzio
      POSTGRES_USER: usilenzio_user
      POSTGRES_PASSWORD: usilenzio_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usilenzio_user -d usilenzio"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - usilenziu-network

  # Application Next.js
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: usilenziu-app
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://usilenzio_user:usilenzio_password_2024@postgres:5432/usilenzio
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=usilenzio
      - POSTGRES_USER=usilenzio_user
      - POSTGRES_PASSWORD=usilenzio_password_2024
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    networks:
      - usilenziu-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: usilenziu-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./public/uploads:/var/www/uploads:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - usilenziu-network

networks:
  usilenziu-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
