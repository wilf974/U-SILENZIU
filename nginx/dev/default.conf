# Configuration Nginx pour DÉVELOPPEMENT (HTTP seulement)
server {
    listen 80;
    server_name localhost;

    # Headers de sécurité basiques
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Route pour servir les uploads
    location /uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Route pour servir les images statiques
    location /images/ {
        alias /app/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Route principale pour l'application Next.js
    location / {
        proxy_pass http://u-silenziu:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}


