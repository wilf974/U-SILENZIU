upstream app {
    server u-silenziu-app:3000;
}

# Redirection HTTP vers HTTPS pour rageroom.usilenziu.com
server {
    listen 80;
    server_name rageroom.usilenziu.com;
    return 301 https://$server_name$request_uri;
}

# Redirection HTTP vers HTTPS pour usilenziu.com
server {
    listen 80;
    server_name usilenziu.com www.usilenziu.com;
    return 301 https://rageroom.usilenziu.com$request_uri;
}

# Configuration HTTPS pour rageroom.usilenziu.com
server {
    listen 443 ssl http2;
    server_name rageroom.usilenziu.com;

    # Augmenter la limite de taille des uploads (par défaut 1MB)
    client_max_body_size 10m;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/rageroom.usilenziu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rageroom.usilenziu.com/privkey.pem;

    # Configuration SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Route pour servir les uploads directement depuis le volume partagé
    location /uploads/ {
        alias /app/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        
        # Gestion des erreurs 404
        try_files $uri =404;
        
        # Types MIME pour les images
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/svg+xml svg;
        }
        default_type application/octet-stream;
    }

    # Route principale pour l'application Next.js
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirection HTTPS pour usilenziu.com vers rageroom.usilenziu.com
server {
    listen 443 ssl http2;
    server_name usilenziu.com www.usilenziu.com;

    # Certificats SSL (même que rageroom.usilenziu.com)
    ssl_certificate /etc/letsencrypt/live/rageroom.usilenziu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rageroom.usilenziu.com/privkey.pem;

    # Configuration SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Redirection permanente vers rageroom.usilenziu.com
    return 301 https://rageroom.usilenziu.com$request_uri;
}

