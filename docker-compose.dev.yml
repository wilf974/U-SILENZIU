# Configuration Docker Compose pour DÉVELOPPEMENT
# Usage: docker-compose -f docker-compose.dev.yml up -d

services:
  # Base de données PostgreSQL - Configuration DEV
  postgres:
    image: postgres:15-alpine
    container_name: u-silenziu-postgres-dev
    environment:
      POSTGRES_DB: usilenzio
      POSTGRES_USER: usilenzio_user
      POSTGRES_PASSWORD: usilenzio_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usilenzio_user -d usilenzio"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - u-silenziu-dev-network

  # Nginx pour DEV (HTTP seulement)
  nginx-dev:
    image: nginx:alpine
    container_name: u-silenziu-nginx-dev
    ports:
      - "8080:80" # Port 8080 pour éviter conflit avec autres services locaux
    volumes:
      - ./nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro # Servir les fichiers statiques directement
    networks:
      - u-silenziu-dev-network
    depends_on:
      - u-silenziu

  # Application Next.js - Configuration DEV
  u-silenziu:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: u-silenziu-app-dev
    # Plus d'exposition directe du port 3000, on passe par Nginx
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Secrets dev (changez ces valeurs !)
      - SESSION_SECRET=dev_session_secret_change_me
      - JWT_SECRET=dev_jwt_secret_change_me
      - JWT_EXPIRES_IN=1h
      # Configuration PostgreSQL DEV (même base que prod pour compatibilité)
      - DATABASE_URL=postgresql://usilenzio_user:usilenzio_password_2024@postgres:5432/usilenzio
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=usilenzio
      - POSTGRES_USER=usilenzio_user
      - POSTGRES_PASSWORD=usilenzio_password_2024
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Volume pour les uploads et logs
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    networks:
      - u-silenziu-dev-network

networks:
  u-silenziu-dev-network:
    driver: bridge
    name: u-silenziu-dev-network

volumes:
  postgres_dev_data:
    driver: local
    name: u-silenziu-postgres-dev-data